<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>To-Do List Proyek E-commerce</title>
    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container py-5">
      <div class="">
        <h1 class="text-center mb-4">Checklist Proyek E-commerce</h1>

        <div class="progress mb-4">
          <div
            class="progress-bar"
            role="progressbar"
            style="width: 0%"
            id="progress-bar"
          ></div>
        </div>

        <div id="todo-list"></div>

        <blockquote class="mt-5 text-center fst-italic quote">
          “Bersabarlah menahan godaan dopamine hit dan brain rot. Mengorbankan
          waktu santai saat ini adalah investasi untuk masa depan yang
          gemilang.”
        </blockquote>
      </div>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS -->
    <script src="script.js"></script>
  </body>
</html>
